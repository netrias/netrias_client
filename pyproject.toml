[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "netrias_client"
version = "0.8.0"
description = "Python client for the Netrias harmonization API"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Chris Harman", email = "charman@netrias.com" },
]
dependencies = [
    "httpx",
    "boto3",
    "openpyxl>=3.1.5",
    # transitive dep pins for security (CVE remediation)
    "jaraco-context>=6.1.0",  # CVE-2026-23949
    "pygments>=2.20.0",  # CVE-2026-4539
    "requests>=2.33.0",  # CVE-2026-25645
    "cryptography>=48.0.1",  # CVE-2026-26007, CVE-2026-34073, CVE-2026-39892
    "urllib3>=2.8.0",  # CVE-2025-66418, CVE-2025-66471, CVE-2026-21441, CVE-2026-44431, CVE-2026-44432, PYSEC-2026-4175, PYSEC-2026-4176, PYSEC-2026-4177
    "idna>=3.15",  # CVE-2026-45409
    "certifi>=2026.10.18",  # PYSEC-2026-4320
    "pandas>=2.3.3",
    "msgpack>=1.2.3",  # GHSA-6v7p-g79w-8964, CVE-2026-114613
    "anyio>=4.14.2",  # CVE-2026-63374, CVE-2026-64847
    "pyyaml>=6.0.3",
]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
]
keywords = ["netrias", "harmonization", "cde", "api", "client"]

[project.urls]
Homepage = "https://github.com/netrias/netrias_client"
Repository = "https://github.com/netrias/netrias_client"
Documentation = "https://github.com/netrias/netrias_client#readme"

# Run with `uv run test` etc
[project.scripts]
check = "netrias_client.scripts:check"
release = "netrias_client.scripts:release"


[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23",
    "ruff>=0.5.0",
    "basedpyright",
    "typing-extensions",
    "ty",
    "python-dotenv>=1.2.2",
    "twine>=5.0",
    "pandas-stubs",
    "vulture>=2.16",
]

[tool.vulture]
paths = ["src"]
min_confidence = 100

[tool.hatch.build]
include = [
    "README.md",
    "src/netrias_client/**",
]
exclude = [
    "src/netrias_client/tests/**",
    "src/netrias_client/live_test/**",
    "architecture.md",
    "uv.lock",
    "*.env",
    "*.csv",
    "*.log",
    "debug_*",
]

[tool.hatch.build.targets.wheel]
packages = ["src/netrias_client"]
exclude = [
    "src/netrias_client/tests/**",
    "src/netrias_client/live_test/**",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "src/netrias_client/tests/**",
    "src/netrias_client/live_test/**",
    "architecture.md",
    "uv.lock",
    "*.env",
    "*.csv",
    "*.log",
    "debug_*",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23",
    "ruff>=0.5.0",
    "basedpyright",
    "typing-extensions",
    "ty",
    "python-dotenv>=1.2.2",
    "twine>=5.0",
    "pip-audit>=2.7.0",
    "pip>=26.2",
    "msgpack>=1.2.3",
    # filelock reaches the dev env only through cachecontrol <- pip-audit.
    # The marker is required because filelock 4.x dropped Python 3.10, which
    # this package still supports; CI resolves to the newest interpreter, so
    # the audit sees the patched version.
    "filelock>=4.2.1; python_version >= '3.11'",  # CVE-2026-112907, CVE-2026-112909, CVE-2026-112910, CVE-2026-112913, CVE-2026-112915, CVE-2026-112935, CVE-2026-112936, CVE-2026-112939, CVE-2026-112940
]


[tool.ruff]
unsafe-fixes = false
line-length = 140

[tool.ruff.lint.mccabe]
max-complexity = 4

[tool.ruff.lint]
select = [
    "E", # Pycodestyle & Pylint errors
    "F", # Pyflakes
    "I", # Import order
    "C", # Pylint convention messages
    "R", # Pylint refactor messages
    "W", # Pylint warning messages
]
ignore = [
    "F401", # Ignore unused import warning
    "F601", # Ignore dictionary key literal repeated warning
    "F811", # Ignore redefinition of unused name warning
    "I001", # Ignore import block is un-sorted or un-formatted
    "W293", # Ignore whitespace warning
    "W291", # Ignore trailing whitespace warning
    "E712", # Ignore comparisons to True/False directly
]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = ["E501"]

[tool.basedpyright]

[[tool.basedpyright.executionEnvironments]]
root = "src/netrias_client/tests"
reportPrivateUsage = "none"